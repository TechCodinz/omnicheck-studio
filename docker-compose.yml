# OmniCheck Studio — local / single-host stack.
#
# This file was rewritten in the 2026-10-24 hardening pass. The previous
# version could not run: it referenced Dockerfiles that did not exist,
# provisioned MongoDB and Redis that the backend never connects to (the
# backend uses better-sqlite3), and shipped a placeholder JWT secret.
#
# Required: create a .env next to this file with a real JWT_SECRET, e.g.
#   JWT_SECRET=$(openssl rand -hex 32)
# The backend refuses to start without a strong secret.
services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    depends_on:
      - backend
